name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Quality gate
        run: make check
      - name: Build packages
        run: uv run wset3-anki build --lang all --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: anki-packages
          path: dist/*.apkg

  release:
    name: Publish versioned release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-versioned-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: anki-packages
          path: dist
      - name: Publish the next patch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f dist/wset3-test-en.apkg
          test -f dist/wset3-test-fr.apkg

          latest="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" \
              --jq '.[].ref | sub("refs/tags/"; "")' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1 || true
          )"

          bump() {
            local ver="${1#v}" major rest minor patch
            major="${ver%%.*}"
            rest="${ver#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            printf 'v%s.%s.%s\n' "$major" "$minor" "$((patch + 1))"
          }

          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            next="$(bump "$latest")"
          fi

          while gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${next}" >/dev/null 2>&1 \
            || gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${next}" >/dev/null 2>&1; do
            next="$(bump "$next")"
          done

          echo "Publishing ${next} from ${GITHUB_SHA}"
          release_id="$(
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$next" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$next" \
              -f body="Automated release from main at ${GITHUB_SHA}." \
              --jq .id
          )"

          for package in dist/wset3-test-en.apkg dist/wset3-test-fr.apkg; do
            name="$(basename "$package")"
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${name}" \
              --input "$package" \
              --silent
          done
