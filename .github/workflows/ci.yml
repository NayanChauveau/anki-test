name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Quality gate
        run: make check
      - name: Build packages
        run: uv run wset3-anki build --lang all --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: anki-packages
          path: dist/*.apkg

  release:
    name: Publish versioned release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require a Deck Manager version tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Deck Manager only follows vX.Y.Z (got ${tag})." >&2
            echo "Rejected: v1.2, v1.2.0-beta, latest-main." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: anki-packages
          path: dist
      - name: Publish stable package names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          test -f dist/wset3-test-en.apkg
          test -f dist/wset3-test-fr.apkg
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists. Cut a new version instead of replacing its files." >&2
            exit 1
          fi
          gh release create "$tag" \
            dist/wset3-test-en.apkg \
            dist/wset3-test-fr.apkg \
            --title "$tag" \
            --generate-notes
